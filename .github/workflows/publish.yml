# Reusable: package each chart with the released image digest, push it to GHCR
# as an OCI artifact, sign it, attach SLSA build provenance to it, then register
# every image index and chart with CommonLayer (GitHub OIDC, audience
# "commonlayer") and wait until the platform promotes or rejects them.
name: publish

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions: {}

jobs:
  chart:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CL_REVISION: ${{ inputs.revision }}
    outputs:
      charts: ${{ steps.list.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned tools
        run: scripts/install-tools.sh yq helm cosign
      - name: Package and push charts
        run: scripts/publish-chart.sh
      - name: Sign charts
        run: scripts/sign.sh sign charts
      - id: list
        name: Chart subjects for provenance
        run: |
          echo "charts=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split("|") | {name: .[2], digest: .[3]})' .build/chart-release.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-release
          path: .build/chart-release.txt
          if-no-files-found: error

  chart-provenance:
    needs: chart
    if: ${{ needs.chart.outputs.charts != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.chart.outputs.charts) }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.chart.name }}
          subject-digest: ${{ matrix.chart.digest }}
          push-to-registry: true

  register:
    needs: [chart, chart-provenance]
    if: ${{ !cancelled() && needs.chart.result == 'success' && needs.chart-provenance.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CL_REVISION: ${{ inputs.revision }}
      CL_API_URL: ${{ vars.COMMONLAYER_API_URL || 'https://commonlayer.org/api/v1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release,chart-release}"
          merge-multiple: true
          path: .build
      - name: Install pinned tools
        run: scripts/install-tools.sh yq
      - name: Submit to CommonLayer and wait for the verdict
        run: scripts/register.sh

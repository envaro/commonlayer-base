# Release: push a tag v<version>-r<revision> (release.tagPattern). Runs the
# validation, then build -> sbom -> sign -> provenance -> publish (chart,
# registration) -> GitHub release. Provenance is GitHub's artifact attestation
# (SLSA v1 build provenance predicate, Sigstore-signed, pushed next to the
# image); see docs/SECURITY.md for what it does and does not establish.
name: release

on:
  push:
    tags: ["v*-r*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: scripts/install-tools.sh yq
      - id: tag
        name: Check the tag against commonlayer.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}; version=${version%-r*}; revision=${TAG##*-r}
          case "$revision" in ''|*[!0-9]*) echo "tag $TAG does not end in -r<number>" >&2; exit 1 ;; esac
          V="$version" yq -e '.versions[] | select(.version == strenv(V))' commonlayer.yaml >/dev/null \
            || { echo "version $version is not in commonlayer.yaml" >&2; exit 1; }
          yq -e '.images[] | select(.base.digest == null or .base.digest == "")' commonlayer.yaml >/dev/null \
            && { echo "every images[].base.digest must be set for a release" >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  validate:
    needs: meta
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: [meta, validate]
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ needs.meta.outputs.revision }}
    permissions:
      contents: read
      packages: write

  sbom:
    needs: [meta, build]
    uses: ./.github/workflows/sbom.yml
    with:
      revision: ${{ needs.meta.outputs.revision }}
    permissions:
      contents: read
      packages: write
      id-token: write

  sign:
    needs: build
    uses: ./.github/workflows/sign.yml
    with:
      scope: images
    permissions:
      contents: read
      packages: write
      id-token: write

  provenance-subjects:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .build
      - id: list
        run: |
          echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split("|") | {name: .[5], digest: .[6]})' .build/release.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: provenance-subjects
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.provenance-subjects.outputs.images) }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true

  publish:
    needs: [meta, sbom, sign, provenance]
    uses: ./.github/workflows/publish.yml
    with:
      revision: ${{ needs.meta.outputs.revision }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release,chart-release,sbom}"
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Released digests (immutable; tags are mutable pointers):"
            echo
            echo '| Artifact | Version | Repository | Digest |'
            echo '|---|---|---|---|'
            awk -F'|' '{print "| " $1 " | " $3 " | " $6 " | `" $7 "` |"}' dist/release/release.txt
            [ -f dist/chart-release/chart-release.txt ] && awk -F'|' '{print "| chart " $1 " | " $2 " | " $3 " | `" $4 "` |"}' dist/chart-release/chart-release.txt
            echo
            echo "Verify: cosign verify <repository>@<digest> --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/'"
          } > notes.md
          tar -czf sboms.tar.gz -C dist/sbom sbom
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md \
            sboms.tar.gz dist/sbom/THIRD_PARTY_LICENSES.md dist/release/release.txt

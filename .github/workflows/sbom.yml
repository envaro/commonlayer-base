# Reusable: SPDX and CycloneDX SBOMs (syft) for every platform manifest of the
# released indexes, attached to each platform digest as keyless-signed cosign
# attestations. Needs the "release" artifact from build.yml.
name: sbom

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CL_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned tools
        run: scripts/install-tools.sh yq syft cosign
      - name: Generate and attest SBOMs
        env:
          CL_ATTEST: "1"
        run: scripts/generate-sbom.sh --release
      - name: License inventory
        run: scripts/generate-license-inventory.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            .build/sbom
            .build/THIRD_PARTY_LICENSES.md
          if-no-files-found: error
